[package]
name = "orbit-browser"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0"
description = "Orbit Browser — a memory-conscious Rust browser shell for 360Digital, powered by Servo."

[dependencies]
iced = { version = "0.14", features = ["advanced", "image", "tokio", "lazy"] }
iced_webview_v2 = { version = "0.1.12", default-features = false, features = ["servo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
urlencoding = "2"
dirs = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package."*"]
opt-level = 2
